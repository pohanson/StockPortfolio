name: stock-portfolio-frontend-dev
services:
  frontend:
    build:
      context: .
      dockerfile: ./Dockerfile.dev
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - FRONTEND_SERVER_URL=http://localhost:3000
      - API_URL=http://backend:5000/api/v1
    develop:
      watch:
        - path: .
          action: sync
          target: /app
        - path: ./compose.dev.yml
          action: rebuild
